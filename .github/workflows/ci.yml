name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Make the release for this version (the version in Cargo.toml, e.g. 1.0.0); empty: only test"
        required: false
        default: ""

# Least privilege: the token can only read the code (the release job asks for more).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Actions are pinned to full commit SHAs (supply-chain safety); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust (stable)
        run: rustup toolchain install stable --profile minimal; rustup default stable
      - name: The libraries the app loads (these exact files, checked)
        run: .github/libraries.ps1
      - name: Build
        run: cargo build --release --locked
      # These machines have no graphics card: the model's own tests skip themselves without its files.
      - name: Test
        run: cargo test --release --locked -- --test-threads=1

  release:
    name: release
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.release != ''
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write # (creates the release, with its zip, in one step: releases can't change afterwards)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The version asked for is the one in Cargo.toml
        env:
          VERSION: ${{ inputs.release }}
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1
          if ($line.Matches[0].Groups[1].Value -ne $env:VERSION) { throw "Cargo.toml says $($line.Matches[0].Groups[1].Value), not $env:VERSION." }
      - name: Rust (stable)
        run: rustup toolchain install stable --profile minimal; rustup default stable
      - name: The libraries the app loads (these exact files, checked)
        run: .github/libraries.ps1
      - name: Build
        run: cargo build --release --locked
      - name: The release zip (the app and its libraries, side by side)
        env:
          VERSION: ${{ inputs.release }}
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target\release\quiekel-embed.exe dist\
          Get-ChildItem vendor -Recurse -Filter *.dll | Copy-Item -Destination dist\
          Copy-Item vendor\pdfium\LICENSE dist\PDFIUM-LICENSE
          Compress-Archive -Path dist\* -DestinationPath "Quiekel-Embed-$env:VERSION-windows-x64.zip"
      - name: The release, with its zip
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release }}
        run: |
          # (the notes: RELEASE.md if the commit has one, else GitHub's list of the merged pull requests)
          $notes = if (Test-Path RELEASE.md) { @("--notes-file", "RELEASE.md") } else { @("--generate-notes") }
          gh release create "v$env:VERSION" "Quiekel-Embed-$env:VERSION-windows-x64.zip" --target "${{ github.sha }}" --title "v$env:VERSION" @notes
