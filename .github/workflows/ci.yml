name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Make or finish the release for this version (the version in Cargo.toml, e.g. 1.0.0); empty: only test"
        required: false
        default: ""

# Least privilege: the token can only read the code (the release job asks for more).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Actions are pinned to full commit SHAs (supply-chain safety); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust (stable)
        run: rustup toolchain install stable --profile minimal; rustup default stable
      - name: The libraries the app loads (these exact files, checked)
        run: .github/libraries.ps1
      - name: Build
        run: cargo build --release --locked
      # These machines have no graphics card: the model's own tests skip themselves without its files.
      - name: Test
        run: cargo test --release --locked -- --test-threads=1
      - name: install.ps1 in Windows PowerShell and PowerShell 7 (the newest of several releases)
        run: .github/install-test.ps1

  # A new version on main gets its release by itself: its zip, built here, goes onto the version's
  # draft (the one its notes were written in, or a new one), is checked against what GitHub has, and
  # once the draft has its notes the release is published, which makes its tag. A manual run with
  # `release` does the same for main's version (after a fix, or once the notes are in).
  release:
    name: release
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write # (puts the zip on the draft and publishes it)
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The version, and its release so far
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASKED: ${{ inputs.release }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:ASKED -and $env:ASKED -ne $version) { throw "Cargo.toml says $version, not $env:ASKED." }
          $release = gh release view "v$version" --json isDraft 2>$null | ConvertFrom-Json
          $found = $LASTEXITCODE -eq 0
          $make = -not $found -or $release.isDraft
          if (-not $make) { Write-Host "v$version is out already: nothing to make." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "make=$($make.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "draft=$($found.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Rust (stable)
        if: steps.version.outputs.make == 'true'
        run: rustup toolchain install stable --profile minimal; rustup default stable
      - name: The libraries the app loads (these exact files, checked)
        if: steps.version.outputs.make == 'true'
        run: .github/libraries.ps1
      - name: Build
        if: steps.version.outputs.make == 'true'
        run: cargo build --release --locked
      - name: The release zip (the app and its libraries side by side, their licenses in licenses\)
        if: steps.version.outputs.make == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/release.ps1 -Version $env:VERSION
      - name: The zip on the version's draft
        if: steps.version.outputs.make == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          DRAFT: ${{ steps.version.outputs.draft }}
        run: |
          $zip = "Quiekel-Embed-$env:VERSION-windows-x64.zip"
          if ($env:DRAFT -eq 'true') {
              gh release upload "v$env:VERSION" $zip --clobber
          } else {
              gh release create "v$env:VERSION" $zip --draft --target $env:GITHUB_SHA --title "v$env:VERSION" --notes ""
          }
          if ($LASTEXITCODE) { throw "The zip didn't go onto v$env:VERSION's draft." }
      # A published release can't change: before publishing, the zip GitHub has must be the one built
      # here (GitHub's SHA-256 of it, which the app's update checks against), holding what
      # release.ps1 laid out, the app at its root.
      - name: Checked, the zip as GitHub has it
        if: steps.version.outputs.make == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = "Quiekel-Embed-$env:VERSION-windows-x64.zip"
          $built = "sha256:$((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower())"
          $release = @(gh api "repos/$env:GH_REPO/releases?per_page=30" | ConvertFrom-Json) | Where-Object tag_name -eq "v$env:VERSION" | Select-Object -First 1
          $asset = @($release.assets) | Where-Object name -eq $zip
          if (-not $asset) { throw "$zip isn't on v$env:VERSION's draft." }
          if ($asset.digest -ne $built) { throw "GitHub has $($asset.digest) for $zip; the zip built here is $built." }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try { $inZip = @($archive.Entries | ForEach-Object FullName | Sort-Object) } finally { $archive.Dispose() }
          $dist = (Resolve-Path dist).Path
          $laidOut = @(Get-ChildItem -LiteralPath $dist -Recurse -File | ForEach-Object { $_.FullName.Substring($dist.Length + 1).Replace('\', '/') } | Sort-Object)
          $differ = Compare-Object $inZip $laidOut
          if ($differ) { throw "The zip and dist\ differ:`n$($differ | Out-String)" }
          if ('quiekel-embed.exe' -notin $inZip) { throw "quiekel-embed.exe isn't at the zip's root." }
          Write-Host "${zip}: $built, $($inZip.Count) files, as GitHub has it."
      - name: Published, once the draft has its notes (this makes the tag)
        id: publish
        if: steps.version.outputs.make == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $release = @(gh api "repos/$env:GH_REPO/releases?per_page=30" | ConvertFrom-Json) | Where-Object tag_name -eq "v$env:VERSION" | Select-Object -First 1
          if (-not "$($release.body)".Trim()) {
              Write-Host "::notice::v$env:VERSION has no notes yet: it stays a draft. Write them on the draft, then run CI with release=$env:VERSION."
              "published=false" >> $env:GITHUB_OUTPUT
              exit 0
          }
          gh release edit "v$env:VERSION" --target $env:GITHUB_SHA --draft=false --latest
          if ($LASTEXITCODE) { throw "v$env:VERSION wasn't published." }
          "published=true" >> $env:GITHUB_OUTPUT

  # Once a release is out: the install line from the README, as anyone runs it, in Windows
  # PowerShell and in PowerShell 7, into a temp folder, with no shortcuts and nothing started. It
  # has to install the new version.
  installs:
    name: installs
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: The install line in Windows PowerShell and PowerShell 7
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          $line = 'irm https://github.com/catdrinkmonster/quiekel-embed/raw/main/install.ps1 | iex'
          foreach ($shell in 'powershell', 'pwsh') {
              $dir = Join-Path $env:RUNNER_TEMP "quiekel-$shell"
              for ($try = 1; ; $try++) {
                  & $shell -NoProfile -Command "`$env:QUIEKEL_DIR = '$dir'; `$env:QUIEKEL_NO_SHORTCUTS = '1'; `$env:QUIEKEL_NO_START = '1'; $line"
                  $exe = Join-Path $dir 'quiekel-embed.exe'
                  $got = if (Test-Path -LiteralPath $exe) { (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion }
                  if ($got -eq $env:VERSION) { break }
                  if ($try -ge 5) { throw "${shell}: the install line gave '$got', not $env:VERSION." }
                  Start-Sleep -Seconds 30 # (GitHub's list of releases can take a moment to show a new one)
              }
              Write-Host "${shell}: v$got, $((Get-ChildItem -LiteralPath $dir -Recurse -File).Count) files"
          }
