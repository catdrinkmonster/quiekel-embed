[project]
name = "quiekel-embed"
version = "0.9.0"
description = "Quiekel Embed: search your own files by meaning, fully local, with EmbeddingGemma 2."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scikit-learn",
    "huggingface-hub",
    "tokenizers",
    "lancedb",
    "pyarrow",
    "fastapi",
    "uvicorn",
    "watchdog",
    "pymupdf",
    "python-docx",
    "python-pptx",
    "openpyxl",
    "pillow",
    "pillow-heif",
    "pywebview>=6.2.1",
    "pystray>=0.19.5",
    "psutil>=7.2.2",
    "nvidia-ml-py>=13.615.71",
    "olefile>=0.47",
    "xlrd>=2.0.2",
]

[project.urls]
Homepage = "https://github.com/catdrinkmonster/quiekel-embed"
Issues = "https://github.com/catdrinkmonster/quiekel-embed/issues"
Security = "https://github.com/catdrinkmonster/quiekel-embed/security"

# The AI engine: one of these two. NVIDIA cards get PyTorch with CUDA (the default, so a plain
# `uv sync` keeps it); any other card, or none, gets ONNX Runtime with DirectML, 2.5 GB smaller:
# `uv sync --no-group nvidia --group directml`. The installer picks one and notes it in
# engine.txt, which updates follow.
[dependency-groups]
dev = ["pytest", "httpx"]
nvidia = ["sentence-transformers[image]>=6.1.0", "transformers", "torch", "torchvision"]
directml = ["onnxruntime-directml>=1.24.4; sys_platform == 'win32'"]

[project.scripts]
quiekel-embed = "quiekel_embed.app:main"
quiekel-embed-shortcuts = "quiekel_embed.shortcuts:main"

# No console window: this is what the Desktop / Start Menu shortcuts launch.
[project.gui-scripts]
quiekel-embed-app = "quiekel_embed.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quiekel_embed"]

# Always run on uv's own Python. The Microsoft Store Python runs as a packaged app: Windows then
# shows its icon for our window in the taskbar and quietly redirects our data folder into its
# package, where uninstalling or resetting that Python would delete it.
[tool.uv]
python-preference = "only-managed"
default-groups = ["dev", "nvidia"]

# CUDA build of PyTorch, for NVIDIA GPUs (CUDA 12.8).
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
