name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the token can only read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs (supply-chain safety); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install exactly the locked dependencies, as the installer does
        run: uv sync --locked
      # These machines have no graphics card: the model's own tests run on the processor, in the
      # setups for PCs without one (a desktop, built-in graphics with 8 GB, an old dual core).
      - name: Download the model's files for the processor (8-bit)
        run: uv run --no-sync python -c "from quiekel_embed import onnx_engine; onnx_engine.download(False)"
      - name: Test
        run: uv run --no-sync pytest -q
